<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
     <link rel="stylesheet" href="./style.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body class="theme-dark">


   <div class="theme-panel">
    <div class="color-palette">
      <span class="color-circle mint" data-theme="mint"></span>
      <span class="color-circle white" data-theme="white"></span>
      <span class="color-circle blue" data-theme="blue"></span>
      <span class="color-circle dark" data-theme="dark"></span>
    </div>
  </div>

<div class="cal">

<h1><i class="fa-solid fa-calculator"></i> Calculator</h1>

<div class="display-wrap">
                <input type="text"  id="input" readonly placeholder="0" aria-label="Calculator display">
            </div>


<div class="buttons">

  <button class="btn">C</button>  
    <button class="btn">DEL</button>  
  <button class="btn">%</button>  
  <button class="btn">÷</button>  


 <button class="btn">7</button>  
    <button class="btn">8</button>  
  <button class="btn">9</button>  
  <button class="btn">×</button>  


 <button class="btn">4</button>  
    <button class="btn">5</button>  
  <button class="btn">6</button>  
  <button class="btn">-</button>  


   <button class="btn">3</button>  
    <button class="btn">2</button>  
  <button class="btn">1</button>  
  <button class="btn">+</button>  


   <button class="btn">0</button>  
    <button class="btn">.</button>  
  <button class="btn">=</button> 
</div>






</div>
























<script src="./index.js"></script>

</body>
</html>
